# Local development. STT/TTS/LLM come from Tarka's public API (https://tarka.rest/v1),
# so no GPU is needed. For the Tarka-hosted stack see tarka/compose.yaml.
services:

  livekit:
    image: livekit/livekit-server:v1.8.4
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        logging:
          level: info
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  rag-service:
    build: ./rag-service
    ports:
      - "8100:8100"
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - RERANKER_MODEL=${RERANKER_MODEL}
      - TOP_K_RETRIEVE=${TOP_K_RETRIEVE}
      - TOP_K_RERANK=${TOP_K_RERANK}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-}
    volumes:
      - ./rag-service/storage:/app/storage
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped
    depends_on:
      - livekit

  nginx:
    build: ./nginx
    ports:
      - "443:443"
    restart: unless-stopped
    depends_on:
      - rag-service
      - livekit

  agent:
    build: ./agent
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL}
      - TARKA_BASE_URL=${TARKA_BASE_URL}
      - TARKA_API_KEY=${TARKA_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - STT_MODEL=${STT_MODEL}
      - STT_LANGUAGE=${STT_LANGUAGE}
      - TTS_MODEL=${TTS_MODEL}
      - TTS_VOICE=${TTS_VOICE}
      - AGENT_NAME=${AGENT_NAME}
    restart: unless-stopped
    depends_on:
      - livekit
      - rag-service

volumes:
  hf-cache:
